<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
    <style>
        svg{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <svg width="600" height="600">
        <!--Izrada pravokutnika-->
        <rect
            x="50"
            y="50"
            width="200"
            height="150"
            fill="pink"
            stroke="purple"
            stroke-width="3"
        />
        <!--Izrada kruga-->
        <circle
            cx="350"
            cy="375"
            r="50"
            fill="yellow"
        />
        <!--Izrada elipse (rx->polumjer elipse po x-osi; ry->polimjer elipse po y-osu)-->
        <ellipse
            cx="450"
            cy="200"
            rx="100"
            ry="50"
            fill="purple"
        />
        <!--Izrada linije-->
        <line
            x1="50"
            x2="125"
            y1="500"
            y2="425"
            stroke="red"
            stroke-width="5"
        />
    </svg>
</body>
</html>
